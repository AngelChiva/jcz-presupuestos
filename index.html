<style>
:root{--azul:#173a73;--azul2:#1f5fae;--naranja:#f08a1c;--fondo:#f4f7fb;--borde:#d9e2ee;--texto:#1c2533;--gris:#6b778a;--rojo:#c0392b;--verde:#1e8e4e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--texto);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--azul);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));box-shadow:0 2px 8px rgba(0,0,0,.15)}
header.top img{width:38px;height:38px;border-radius:8px;background:#fff;object-fit:contain}
header.top .t{font-weight:700;font-size:17px;line-height:1.1}
header.top .s{font-size:12px;opacity:.8}
header.top .sp{flex:1}
header.top button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
main{max-width:900px;margin:0 auto;padding:14px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--borde);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;background:none;border:none;padding:9px 4px 8px;font-size:12px;color:var(--gris);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom button .i{font-size:20px;line-height:1}
nav.bottom button.on{color:var(--azul2);font-weight:600}
.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:20px;margin:4px 0 12px;color:var(--azul)}
h3{font-size:15px;margin:0 0 10px;color:var(--azul);text-transform:uppercase;letter-spacing:.04em}
label{display:block;font-size:13px;color:var(--gris);margin:8px 0 4px}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--borde);border-radius:9px;padding:10px 11px;background:#fff;font-size:16px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--azul2);outline-offset:-1px;border-color:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--azul2);color:#fff;font-size:15px;text-decoration:none}
.btn.nar{background:var(--naranja)}
.btn.sec{background:#fff;color:var(--azul2);border:1px solid var(--azul2)}
.btn.peligro{background:#fff;color:var(--rojo);border:1px solid var(--rojo)}
.btn.wa{background:#25a244}
.btn.peq{padding:7px 11px;font-size:13px;border-radius:8px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
.lista .it{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--borde);cursor:pointer}
.lista .it:last-child{border-bottom:none}
.lista .it:hover{background:#f8fbff}
.lista .num{font-weight:700;color:var(--azul2);font-size:14px}
.lista .cli{font-weight:600}
.lista .sub{font-size:13px;color:var(--gris)}
.lista .tot{margin-left:auto;font-weight:700;white-space:nowrap}
.vacio{color:var(--gris);text-align:center;padding:26px 10px}
.linea{border:1px solid var(--borde);border-radius:10px;padding:10px;margin-bottom:10px;background:#fbfdff;position:relative}
.linea .x{position:absolute;top:6px;right:6px;background:none;border:none;color:var(--rojo);font-size:20px;cursor:pointer;padding:2px 8px}
.linea .imp{text-align:right;font-weight:700;margin-top:6px}
.totales{margin-left:auto;max-width:340px}
.totales div{display:flex;justify-content:space-between;padding:4px 0}
.totales .grande{font-size:20px;font-weight:800;color:var(--azul);border-top:2px solid var(--naranja);margin-top:4px;padding-top:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gris);margin:6px 0 0}
.chk input{width:18px;height:18px}
.campo{border-bottom:1px dashed var(--borde);padding-bottom:10px;margin-bottom:6px}
.aviso{background:#fff6e9;border:1px solid #f6c98d;color:#7a4a08;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.ok{background:#eaf7ef;border-color:#a9dcbc;color:#1d5e36}
.login{max-width:380px;margin:9vh auto;text-align:center}
.login img{width:190px;max-width:70%}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c2533;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:100;max-width:90vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.modal .caja{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.modal .caja{border-radius:16px}}
.pdfprev{width:100%;height:75vh;border:1px solid var(--borde);border-radius:8px}
.hidden{display:none!important}
.peque{font-size:12px;color:var(--gris)}
.badge{display:inline-block;background:#fff3e3;color:#a85a00;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600}
</style>
</head>

/* ======================== Utilidades ======================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const r2 = n => Math.round((Number(n) || 0) * 100 + Number.EPSILON) / 100;
const num = v => { if (typeof v === "number") return v; const s = String(v ?? "").trim().replace(/\s/g, "").replace("€", ""); if (!s) return 0; const n = s.includes(",") ? Number(s.replace(/\./g, "").replace(",", ".")) : Number(s); return isFinite(n) ? n : 0; };
function eur(n, simbolo = true) {
  n = r2(n); const neg = n < 0; n = Math.abs(n);
  const [e, d] = n.toFixed(2).split(".");
  const ent = e.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return (neg ? "-" : "") + ent + "," + d + (simbolo ? " €" : "");
}
const fmtNum = n => { n = r2(n); return Number.isInteger(n) ? String(n) : String(n).replace(".", ","); };
const hoyISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fechaES = iso => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; };
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
const soloDig = s => String(s ?? "").replace(/\D/g, "");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), ms); }
function telBonito(t) { const d = soloDig(t); return d.length === 9 ? d.replace(/(\d{3})(\d{3})(\d{3})/, "$1 $2 $3") : (t || ""); }

const MODO_PRUEBA = !FIREBASE_CONFIG.apiKey;
let DB; // { list, get, set, add, del, siguienteNumero }
let usuario = null; // {email, nombre, admin}

function datosLocales() {
  const K = "jcz_prueba_";
  const leer = c => { try { return JSON.parse(localStorage.getItem(K + c) || "{}"); } catch { return {}; } };
  const escribir = (c, o) => localStorage.setItem(K + c, JSON.stringify(o));
  return {
    async list(c) { return Object.entries(leer(c)).map(([id, v]) => ({ id, ...v })); },
    async get(c, id) { const o = leer(c); return o[id] ? { id, ...o[id] } : null; },
    async set(c, id, data) { const o = leer(c); o[id] = { ...(o[id] || {}), ...data }; escribir(c, o); return id; },
    async add(c, data) { const id = uid(); await this.set(c, id, data); return id; },
    async del(c, id) { const o = leer(c); delete o[id]; escribir(c, o); },
    async siguienteNumero(anio) { const o = leer("contadores"); const n = (o[anio]?.ultimo || 0) + 1; o[anio] = { ultimo: n }; escribir("contadores", o); return n; }
  };
}

async function datosFirebase() {
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const appM = await import(base + "firebase-app.js");
  const authM = await import(base + "firebase-auth.js");
  const fs = await import(base + "firebase-firestore.js");
  const app = appM.initializeApp(FIREBASE_CONFIG);
  let db;
  try { db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
  catch { db = fs.getFirestore(app); }
  const auth = authM.getAuth(app);
  const api = {
    auth, authM,
    async list(c) { const s = await fs.getDocs(fs.collection(db, c)); return s.docs.map(d => ({ id: d.id, ...d.data() })); },
    async get(c, id) { const s = await fs.getDoc(fs.doc(db, c, id)); return s.exists() ? { id: s.id, ...s.data() } : null; },
    async set(c, id, data) { await fs.setDoc(fs.doc(db, c, id), data, { merge: true }); return id; },
    async add(c, data) { const r = await fs.addDoc(fs.collection(db, c), data); return r.id; },
    async del(c, id) { await fs.deleteDoc(fs.doc(db, c, id)); },
    async siguienteNumero(anio) {
      const ref = fs.doc(db, "contadores", String(anio));
      return fs.runTransaction(db, async tx => { const s = await tx.get(ref); const n = (s.exists() ? (s.data().ultimo || 0) : 0) + 1; tx.set(ref, { ultimo: n }); return n; });
    }
  };
  return api;
}

async function cargarTodo() {
  const [e, p, c, k] = await Promise.all([DB.get("config", "empresa"), DB.list("presupuestos"), DB.list("clientes"), DB.list("conceptos")]);
  empresa = { ...EMPRESA_DEFECTO, ...(e || {}) };
  cache.presupuestos = p.sort((a, b) => (b.anio - a.anio) || (b.n - a.n));
  cache.clientes = c.sort((a, b) => norm(a.nombre).localeCompare(norm(b.nombre)));
  cache.conceptos = k.sort((a, b) => norm(a.nombre).localeCompare(norm(b.nombre)));
}

/* ======================== Cálculos ======================== */
function importeLinea(l) { return r2(num(l.cantidad) * num(l.precio) * (1 - num(l.dto) / 100)); }
function calcular(p) {
  let bruto = 0, neto = 0;
  for (const l of p.lineas || []) { bruto += r2(num(l.cantidad) * num(l.precio)); neto += importeLinea(l); }
  bruto = r2(bruto); neto = r2(neto);
  const descuentos = r2(bruto - neto);
  const iva = r2(neto * num(p.iva) / 100);
  return { bruto, descuentos, base: neto, cuotaIva: iva, total: r2(neto + iva) };
}

  const pintarLineas = () => {
    $("#lineas").innerHTML = e.lineas.map((l, i) => `

        <label style="margin-top:0">Concepto</label>

    document.querySelectorAll(".linea").forEach(div => {

  }
}

async function guardar(silencioso) {
  const e = editando;
  e.lineas = e.lineas.filter(l => l.concepto.trim() || l.descripcion.trim() || num(l.precio));
  if (!e.lineas.length) { e.lineas = [lineaVacia()]; toast("Añade al menos una partida"); return false; }
  if (!e.cliente.nombre) { toast("Pon el nombre del cliente"); $("#cNombre")?.focus(); return false; }
  const btn = $("#guardar"); if (btn) btn.disabled = true;
  try {
    // 1) Conceptos nuevos: preguntar si se guardan
    const nuevos = [];
    for (const l of e.lineas) { const nom = l.concepto.trim(); if (nom && !cache.conceptos.some(k => norm(k.nombre) === norm(nom)) && !nuevos.some(n => norm(n.nombre) === norm(nom))) nuevos.push({ nombre: nom, precio: l.precio }); }
    if (nuevos.length) {
      const elegidos = await preguntarConceptos(nuevos);
      for (const k of elegidos) { const d = { nombre: k.nombre, precio: k.conPrecio && String(k.precio).trim() !== "" ? num(k.precio) : null }; const id = await DB.add("conceptos", d); cache.conceptos.push({ id, ...d }); }
      cache.conceptos.sort((a, b) => norm(a.nombre).localeCompare(norm(b.nombre)));
    }
    // 2) Cliente: crear o actualizar
    const cd = { ...e.cliente };
    let cli = e.clienteId ? cache.clientes.find(c => c.id === e.clienteId) : cache.clientes.find(c => norm(c.nombre) === norm(cd.nombre));
    if (cli && norm(cli.nombre) !== norm(cd.nombre)) cli = cache.clientes.find(c => norm(c.nombre) === norm(cd.nombre));
    if (cli) { await DB.set("clientes", cli.id, cd); Object.assign(cli, cd); e.clienteId = cli.id; }
    else { const id = await DB.add("clientes", cd); cache.clientes.push({ id, ...cd }); e.clienteId = id; cache.clientes.sort((a, b) => norm(a.nombre).localeCompare(norm(b.nombre))); }
    // 3) Numerar si es nuevo
    if (!e.id) {
      const anio = Number((e.fecha || hoyISO()).slice(0, 4));
      const n = await DB.siguienteNumero(anio);
      e.anio = anio; e.n = n; e.numero = `P-${anio}-${String(n).padStart(4, "0")}`;
    }
    e.lineas = e.lineas.map(l => ({ concepto: l.concepto.trim(), descripcion: l.descripcion.trim(), cantidad: num(l.cantidad), precio: num(l.precio), dto: num(l.dto) }));
    e.totales = calcular(e);
    e.actualizado = new Date().toISOString(); e.por = usuario?.email || "prueba";
    const datos = { numero: e.numero, anio: e.anio, n: e.n, fecha: e.fecha, cliente: e.cliente, clienteId: e.clienteId, lineas: e.lineas, iva: num(e.iva), observaciones: e.observaciones, condiciones: e.condiciones, totales: e.totales, actualizado: e.actualizado, por: e.por };
    if (!e.id) { datos.creado = e.actualizado; e.id = await DB.add("presupuestos", datos); cache.presupuestos.unshift({ id: e.id, ...datos }); }
    else { await DB.set("presupuestos", e.id, datos); const i = cache.presupuestos.findIndex(p => p.id === e.id); if (i >= 0) cache.presupuestos[i] = { id: e.id, ...datos }; }
    cache.presupuestos.sort((a, b) => (b.anio - a.anio) || (b.n - a.n));
    toast(`Guardado ${e.numero}`);
    verEditor(cache.presupuestos.find(p => p.id === e.id));
    return true;
  } catch (err) { console.error(err); toast("No se ha podido guardar: " + (err.code || err.message)); return false; }
  finally { const b = $("#guardar"); if (b) b.disabled = false; }
}

function preguntarConceptos(nuevos) {
  return new Promise(res => {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div class="caja"><h2>¿Guardar conceptos nuevos?</h2><p class="peque">Se guarda solo el nombre del concepto (la descripción no). Así la próxima vez solo tendrás que elegirlo.</p>
      ${nuevos.map((k, i) => `<div class="campo"><label class="chk" style="color:var(--texto);font-weight:600"><input type="checkbox" data-g="${i}" checked> ${esc(k.nombre)}</label>
      <label class="chk"><input type="checkbox" data-p="${i}"> Guardar también el precio${String(k.precio).trim() ? " (" + eur(num(k.precio)) + ")" : ""}</label></div>`).join("")}
      <div class="acciones" style="margin-top:12px"><button class="btn" id="mOk">Guardar marcados</button><button class="btn sec" id="mNo">No guardar</button></div></div>`;
    document.body.appendChild(m);
    m.querySelector("#mOk").onclick = () => { const r = nuevos.map((k, i) => ({ ...k, conPrecio: m.querySelector(`[data-p="${i}"]`).checked })).filter((k, i) => m.querySelector(`[data-g="${i}"]`).checked); m.remove(); res(r); };
    m.querySelector("#mNo").onclick = () => { m.remove(); res([]); };
  });
}

/* ======================== PDF ======================== */
const AZUL = [23, 58, 115], AZUL2 = [31, 95, 174], NAR = [240, 138, 28], GRIS = [107, 119, 138], TEXTO = [28, 37, 51], CLARO = [238, 244, 251];
const tamImg = src => new Promise(r => { const i = new Image(); i.onload = () => r({ w: i.naturalWidth, h: i.naturalHeight }); i.onerror = () => r({ w: 1, h: 1 }); i.src = src; });
const fmtImg = src => /^data:image\/png/.test(src) ? "PNG" : "JPEG";

const limpia = s => String(s ?? "").replace(/²/g, "2").replace(/³/g, "3").replace(/[–—]/g, "-").replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/…/g, "...");
async function crearPdf(p) {
  p = JSON.parse(JSON.stringify(p, (k, v) => typeof v === "string" ? limpia(v) : v));
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const W = 210, H = 297, M = 15;
  const logo = logoActual(); const dim = await tamImg(logo); const ratio = dim.h / dim.w;
  const t = calcular(p);
  const E = empresa, ver = k => E[k + "Ver"] && String(E[k] || "").trim();

  const marca = () => { if (!E.marcaAgua) return; doc.saveGraphicsState(); doc.setGState(new doc.GState({ opacity: 0.035 })); const w = 125, h = w * ratio; doc.addImage(logo, fmtImg(logo), (W - w) / 2, (H - h) / 2 + 10, w, h, "wm", "FAST"); doc.restoreGraphicsState(); };
  marca();

  // Cabecera
  let x = M, y = 14;
  doc.setFillColor(...NAR); doc.rect(0, 0, W, 3, "F");
  if (E.logoVer) { const lw = 30, lh = lw * ratio; doc.addImage(logo, fmtImg(logo), M, 9, lw, lh, "logo", "FAST"); x = M + lw + 5; y = 15; }
  doc.setTextColor(...AZUL); doc.setFont("helvetica", "bold"); doc.setFontSize(15);
  if (ver("nombre")) { doc.text(E.nombre, x, y); y += 5; }
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...GRIS);
  if (ver("actividad")) { doc.text(E.actividad, x, y); y += 5; }
  doc.setFontSize(8.5); doc.setTextColor(...TEXTO);
  const datosE = [ver("nif") ? "NIF/CIF: " + E.nif : "", ver("direccion") ? E.direccion : "", [ver("telefono") ? "Tel. " + E.telefono : "", ver("email") ? E.email : ""].filter(Boolean).join("  ·  ")].filter(Boolean);
  for (const d of datosE) { for (const ln of doc.splitTextToSize(d, 95)) { doc.text(ln, x, y); y += 4; } }
  // Bloque derecho
  doc.setTextColor(...AZUL2); doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.text("PRESUPUESTO", W - M, 17, { align: "right" });
  doc.setFontSize(12); doc.setTextColor(...NAR); doc.text(p.numero || "", W - M, 24, { align: "right" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...TEXTO); doc.text("Fecha: " + fechaES(p.fecha), W - M, 30, { align: "right" });
  y = Math.max(y, E.logoVer ? 9 + 30 * ratio : 0, 34) + 5;

  // Cliente
  const c = p.cliente || {};
  const lc = [c.direccion, [c.telefono ? "Tel. " + telBonito(c.telefono) : "", c.email].filter(Boolean).join("  ·  "), c.nif ? "NIF/DNI: " + c.nif : ""].filter(Boolean);
  const lineasC = lc.flatMap(s => doc.splitTextToSize(s, W - 2 * M - 10));
  doc.setFont("helvetica", "bold"); doc.setFontSize(11); const nomC = doc.splitTextToSize(c.nombre || "", W - 2 * M - 10); doc.setFont("helvetica", "normal"); doc.setFontSize(9);
  const hC = 14 + (nomC.length - 1) * 4.8 + lineasC.length * 4.3;
  doc.setFillColor(...CLARO); doc.setDrawColor(...CLARO); doc.roundedRect(M, y, W - 2 * M, hC, 2, 2, "F");
  doc.setFillColor(...AZUL2); doc.rect(M, y, 1.4, hC, "F");
  doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); doc.setTextColor(...AZUL2); doc.text("CLIENTE", M + 5, y + 5);
  doc.setFontSize(11); doc.setTextColor(...TEXTO); nomC.forEach((ln, i) => doc.text(ln, M + 5, y + 10.5 + i * 4.8));
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); let yy = y + 15 + (nomC.length - 1) * 4.8;
  for (const ln of lineasC) { doc.text(ln, M + 5, yy); yy += 4.3; }
  y += hC + 6;

  // Tabla
  const hayDto = (p.lineas || []).some(l => num(l.dto));
  const anchos = hayDto ? { u: 15, p: 24, d: 15, i: 27 } : { u: 16, p: 26, d: 0, i: 28 };
  const wConc = W - 2 * M - anchos.u - anchos.p - anchos.d - anchos.i;
  const cuerpo = (p.lineas || []).map(l => {
    doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); const a = doc.splitTextToSize(l.concepto || "", wConc - 6);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); const b = l.descripcion ? doc.splitTextToSize(l.descripcion, wConc - 6) : [];
    const fila = [{ content: "", _a: a, _b: b, styles: { minCellHeight: 3 + a.length * 4.1 + b.length * 3.7 + 2.5 } }, fmtNum(l.cantidad), eur(l.precio)];
    if (hayDto) fila.push(num(l.dto) ? fmtNum(l.dto) + "%" : "");
    fila.push(eur(importeLinea(l)));
    return fila;
  });
  const cab = ["CONCEPTO", "UDS.", "PRECIO"]; if (hayDto) cab.push("DTO."); cab.push("IMPORTE");
  const colStyles = { 0: { cellWidth: wConc }, 1: { cellWidth: anchos.u, halign: "center" }, 2: { cellWidth: anchos.p, halign: "right" } };
  if (hayDto) { colStyles[3] = { cellWidth: anchos.d, halign: "center" }; colStyles[4] = { cellWidth: anchos.i, halign: "right", fontStyle: "bold" }; }
  else colStyles[3] = { cellWidth: anchos.i, halign: "right", fontStyle: "bold" };
  doc.autoTable({
    startY: y, head: [cab], body: cuerpo, margin: { left: M, right: M, top: 18, bottom: 20 }, theme: "plain",
    styles: { font: "helvetica", fontSize: 9.5, textColor: TEXTO, cellPadding: { top: 3, bottom: 3, left: 3, right: 3 }, lineColor: [217, 226, 238], lineWidth: { bottom: 0.2 }, valign: "top" },
    headStyles: { fillColor: AZUL, textColor: [255, 255, 255], fontStyle: "bold", fontSize: 8, lineWidth: 0 },
    columnStyles: colStyles,
    didParseCell: d => { if (d.section === "head" && d.column.index > 0) d.cell.styles.halign = d.column.index === 1 || (hayDto && d.column.index === 3) ? "center" : "right"; },
    didDrawCell: d => {
      if (d.section === "body" && d.column.index === 0) {
        const r = d.cell.raw; let ty = d.cell.y + 3 + 3.3;
        doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); doc.setTextColor(...TEXTO);
        for (const ln of r._a) { doc.text(ln, d.cell.x + 3, ty); ty += 4.1; }
        doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...GRIS);
        for (const ln of r._b) { doc.text(ln, d.cell.x + 3, ty); ty += 3.7; }
        doc.setTextColor(...TEXTO);
      }
    },
    willDrawPage: d => { if (d.pageNumber > 1) marca(); }
  });
  y = doc.lastAutoTable.finalY + 6;

  const nuevaPagina = () => { doc.addPage(); marca(); y = 20; };
  // Totales
  const filas = [];
  if (t.descuentos) { filas.push(["Subtotal", eur(t.bruto)]); filas.push(["Descuentos", "-" + eur(t.descuentos)]); }
  filas.push(["Base imponible", eur(t.base)]); filas.push([`IVA ${fmtNum(p.iva)}%`, eur(t.cuotaIva)]);
  const hT = filas.length * 6 + 14;
  if (y + hT > H - 25) nuevaPagina();
  const xT = W - M - 80;
  doc.setFontSize(9.5);
  for (const [a, b] of filas) { doc.setFont("helvetica", "normal"); doc.setTextColor(...GRIS); doc.text(a, xT + 3, y); doc.setTextColor(...TEXTO); doc.text(b, W - M - 3, y, { align: "right" }); y += 6; }
  doc.setFillColor(...NAR); doc.roundedRect(xT, y - 2, 80, 11, 2, 2, "F");
  doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(12);
  doc.text("TOTAL", xT + 4, y + 5.4); doc.text(eur(t.total), W - M - 4, y + 5.4, { align: "right" });
  y += 18;

  // Notas
  const bloques = [];
  if (String(p.observaciones || "").trim() && E.observacionesVer) bloques.push(["OBSERVACIONES", p.observaciones]);
  if (String(p.condiciones || "").trim() && E.condicionesVer) bloques.push(["CONDICIONES DE PAGO", p.condiciones]);
  if (ver("iban")) bloques.push(["DATOS BANCARIOS", "IBAN: " + E.iban]);
  if (ver("validez")) bloques.push(["VALIDEZ", E.validez]);
  for (const [tit, txt] of bloques) {
    doc.setFont("helvetica", "normal"); doc.setFontSize(9);
    const ls = doc.splitTextToSize(String(txt), W - 2 * M);
    if (y + 6 + ls.length * 4.2 > H - 22) nuevaPagina();
    doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); doc.setTextColor(...AZUL2); doc.text(tit, M, y); y += 4.5;
    doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...TEXTO);
    for (const ln of ls) { doc.text(ln, M, y); y += 4.2; }
    y += 4;
  }

  // Pie de página
  const total = doc.getNumberOfPages();
  for (let i = 1; i <= total; i++) {
    doc.setPage(i);
    doc.setDrawColor(...NAR); doc.setLineWidth(0.4); doc.line(M, H - 14, W - M, H - 14);
    doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(...GRIS);
    doc.text([E.nombreVer ? E.nombre : "", ver("telefono") ? "Tel. " + E.telefono : "", ver("email") ? E.email : ""].filter(Boolean).join("  ·  "), M, H - 9.5);
    doc.text(`${p.numero}  ·  Página ${i} de ${total}`, W - M, H - 9.5, { align: "right" });
  }
  return doc;
}

const nombreArchivo = p => `Presupuesto_${p.numero}_${norm(p.cliente?.nombre || "").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "")}.pdf`.replace(/_\.pdf$/, ".pdf");

async function verPdf(p) {
  const doc = await crearPdf(p); const url = URL.createObjectURL(doc.output("blob"));
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="caja" style="max-width:900px"><div class="acciones" style="justify-content:space-between;margin-bottom:10px"><b>${esc(p.numero)}</b><div class="acciones"><a class="btn sec peq" href="${url}" target="_blank" rel="noopener">Abrir en pestaña</a><button class="btn peq" id="cerrar">Cerrar</button></div></div><iframe class="pdfprev" src="${url}"></iframe></div>`;
  document.body.appendChild(m);
  m.querySelector("#cerrar").onclick = () => { m.remove(); URL.revokeObjectURL(url); };
}
async function descargarPdf(p) { const doc = await crearPdf(p); doc.save(nombreArchivo(p)); }
async function archivoPdf(p) { const doc = await crearPdf(p); return new File([doc.output("blob")], nombreArchivo(p), { type: "application/pdf" }); }
const mensaje = p => `Hola${p.cliente?.nombre ? " " + p.cliente.nombre.split(" ")[0] : ""}, te envío el presupuesto ${p.numero} por un total de ${eur(calcular(p).total)} (IVA incluido). Cualquier duda me dices.\n\n${empresa.nombre || ""}`;

async function compartirPdf(p) {
  const f = await archivoPdf(p);
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f], title: p.numero, text: mensaje(p) }); } catch (e) { if (e.name !== "AbortError") toast("No se pudo compartir"); }
  } else { await descargarPdf(p); toast("Este navegador no permite compartir archivos: se ha descargado el PDF para que lo adjuntes.", 4500); }
}
async function whatsapp(p) {
  const f = await archivoPdf(p);
  const movil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (movil && navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f], text: mensaje(p) }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  // Ordenador: descargar el PDF y abrir el chat con el mensaje preparado
  await descargarPdf(p);
  let tel = soloDig(p.cliente?.telefono); if (tel.length === 9) tel = "34" + tel;
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(mensaje(p))}`, "_blank");
  toast("PDF descargado. En WhatsApp Web, adjúntalo con el clip 📎.", 5000);
}

/* ======================== Excel ======================== */
function exportar(nombre, filas) {
  if (!filas.length) return toast("No hay nada que exportar");
  const ws = XLSX.utils.json_to_sheet(filas); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, nombre);
  XLSX.writeFile(wb, `JCZ_${nombre}_${hoyISO()}.xlsx`);
}
function exportarPresupuestos() {
  exportar("Presupuestos", cache.presupuestos.map(p => ({ Número: p.numero, Fecha: fechaES(p.fecha), Cliente: p.cliente?.nombre, Teléfono: p.cliente?.telefono, Dirección: p.cliente?.direccion, Partidas: (p.lineas || []).map(l => l.concepto).join(" | "), "Base imponible": p.totales?.base, "IVA %": p.iva, IVA: p.totales?.cuotaIva, Total: p.totales?.total })));
}
async function importar(file, tipo) {
  if (!file) return;
  try {
    const wb = XLSX.read(await file.arrayBuffer()); const filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
    const col = (f, ...ns) => { for (const k of Object.keys(f)) if (ns.includes(norm(k))) return String(f[k]).trim(); return ""; };
    let nuevos = 0, act = 0;
    for (const f of filas) {
      if (tipo === "clientes") {
        const v = { nombre: col(f, "nombre", "cliente"), telefono: col(f, "telefono", "tel", "movil"), email: col(f, "email", "correo"), direccion: col(f, "direccion"), nif: col(f, "nif/dni", "nif", "dni", "cif") };
        if (!v.nombre) continue;
        const ex = cache.clientes.find(c => norm(c.nombre) === norm(v.nombre));
        if (ex) { await DB.set("clientes", ex.id, v); Object.assign(ex, v); act++; } else { const id = await DB.add("clientes", v); cache.clientes.push({ id, ...v }); nuevos++; }
      } else {
        const pr = col(f, "precio", "precio €", "importe");
        const v = { nombre: col(f, "concepto", "nombre"), descripcion: "", precio: pr === "" ? null : num(pr) };
        if (!v.nombre) continue;
        const ex = cache.conceptos.find(k => norm(k.nombre) === norm(v.nombre));
        if (ex) { await DB.set("conceptos", ex.id, v); Object.assign(ex, v); act++; } else { const id = await DB.add("conceptos", v); cache.conceptos.push({ id, ...v }); nuevos++; }
      }
    }
    toast(`Importado: ${nuevos} nuevos, ${act} actualizados`);
    tipo === "clientes" ? verClientes() : verConceptos();
  } catch (e) { console.error(e); toast("No se ha podido leer el Excel"); }
}

async function guardarAjustes(redibujar) {
  document.querySelectorAll("[data-k]").forEach(i => empresa[i.dataset.k] = i.dataset.k === "iva" ? num(i.value) : i.value.trim());

  try { await DB.set("config", "empresa", empresa); toast("Datos de empresa guardados"); verAjustes(); } catch (e) { toast("Error: " + (e.code || e.message)); }
}
function reducirImagen(file, max) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => { const img = new Image(); img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", 0.85)); }; img.onerror = rej; img.src = fr.result; }; fr.onerror = rej; fr.readAsDataURL(file); });
}

function pantallaLogin(msg) {
  pintar(`<div class="login card"><img src="${LOGO_DEFECTO}" alt="JCZ Electric Services"><h2 style="margin-top:14px">Presupuestos</h2>
    <p class="peque">Acceso privado. Entra con tu cuenta de Google autorizada.</p>

    <button class="btn full" id="entrar" style="padding:14px">Entrar con Google</button></div>`);
  $("#entrar").onclick = async () => {
    const prov = new DB.authM.GoogleAuthProvider(); prov.setCustomParameters({ prompt: "select_account" });
    try { await DB.authM.signInWithPopup(DB.auth, prov); }
    catch (e) { if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") await DB.authM.signInWithRedirect(DB.auth, prov); else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") pantallaLogin("No se pudo entrar: " + esc(e.code || e.message)); }
  };
}

async function arrancar() {
  pintar(`<div class="vacio" style="margin-top:30vh">Cargando…</div>`);
  if (MODO_PRUEBA) {
    DB = datosLocales(); usuario = { email: "prueba", nombre: "Prueba", admin: true };
    await cargarTodo(); ir("inicio"); return;
  }
  try { DB = await datosFirebase(); } catch (e) { pintar(`<div class="login card"><div class="aviso">No se ha podido conectar. Revisa la conexión a internet y recarga.</div></div>`); return; }
  DB.authM.onAuthStateChanged(DB.auth, async u => {
    if (!u) return pantallaLogin();
    const mail = (u.email || "").toLowerCase();
    if (!CUENTAS[mail]) { await DB.authM.signOut(DB.auth); return pantallaLogin(`La cuenta <b>${esc(mail)}</b> no tiene acceso a esta aplicación.`); }
    usuario = { email: mail, ...CUENTAS[mail] };
    try { await cargarTodo(); ir("inicio"); }
    catch (e) { console.error(e); pintar(`<div class="login card"><div class="aviso">No se han podido cargar los datos (${esc(e.code || e.message)}). Si acabas de configurar Firebase, revisa que las reglas estén publicadas.</div><button class="btn" onclick="location.reload()">Reintentar</button></div>`); }
  });
}
